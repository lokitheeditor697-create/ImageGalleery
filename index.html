<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Wander Gallery</h1>
    <p>Explore curated moments from nature, cities, and abstract scenes.</p>
  </header>

  <main class="container">
    <section class="controls" aria-label="Gallery filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="city">City</button>
      <button class="filter-btn" data-filter="abstract">Abstract</button>
    </section>

    <section class="gallery" id="gallery">
      <figure class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Mountain valley and river" loading="lazy" />
        <figcaption>Mountain Stream</figcaption>
      </figure>
      <figure class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1200&q=80" alt="City skyline at dusk" loading="lazy" />
        <figcaption>Urban Twilight</figcaption>
      </figure>
      <figure class="card" data-category="abstract">
        <img src="https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1200&q=80" alt="Colorful abstract lights" loading="lazy" />
        <figcaption>Neon Bloom</figcaption>
      </figure>
      <figure class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Forest path with sunlight" loading="lazy" />
        <figcaption>Forest Trail</figcaption>
      </figure>
      <figure class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1200&q=80" alt="Road in downtown city" loading="lazy" />
        <figcaption>City Drive</figcaption>
      </figure>
      <figure class="card" data-category="abstract">
        <img src="https://images.unsplash.com/photo-1508615039623-a25605d2b022?auto=format&fit=crop&w=1200&q=80" alt="Painted abstract texture" loading="lazy" />
        <figcaption>Paint Drift</figcaption>
      </figure>
      <figure class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" alt="Foggy mountain landscape" loading="lazy" />
        <figcaption>Misty Peaks</figcaption>
      </figure>
      <figure class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1f?auto=format&fit=crop&w=1200&q=80" alt="Aerial view of city buildings" loading="lazy" />
        <figcaption>Gridlines</figcaption>
      </figure>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeBtn" aria-label="Close lightbox">×</button>
    <button class="nav prev" id="prevBtn" aria-label="Previous image">❮</button>
    <img id="lightboxImage" src="" alt="Expanded gallery preview" />
    <p id="lightboxCaption"></p>
    <button class="nav next" id="nextBtn" aria-label="Next image">❯</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
